<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>טיימר של 3 דקות</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #17324d;
        --muted: #496172;
        --sky: #bfe8ff;
        --mint: #96dcc0;
        --peach: #ffb47c;
        --lemon: #ffd85c;
        --berry: #d95d7f;
        --paper: #fffaf0;
        --shadow: 0 22px 55px rgba(22, 42, 70, 0.18);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        color: var(--ink);
        background:
          linear-gradient(180deg, rgba(191, 232, 255, 0.88), rgba(255, 250, 240, 0.82) 58%),
          radial-gradient(circle at 18% 16%, rgba(255, 216, 92, 0.5), transparent 24%),
          linear-gradient(135deg, #e4f5ff, #fff2dc);
        overflow-x: hidden;
      }

      button {
        font: inherit;
      }

      .page {
        min-height: 100vh;
        display: grid;
        grid-template-rows: auto 1fr;
      }

      header {
        width: min(1120px, calc(100% - 32px));
        margin: 0 auto;
        padding: 18px 0 8px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        font-weight: 900;
        font-size: clamp(1.05rem, 3vw, 1.35rem);
      }

      .brand-mark {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: var(--lemon);
        border: 4px solid rgba(255, 255, 255, 0.85);
        box-shadow: 0 10px 20px rgba(199, 126, 28, 0.22);
        flex: 0 0 auto;
      }

      .sound-toggle {
        min-height: 44px;
        border: 0;
        border-radius: 999px;
        padding: 0 16px;
        background: rgba(255, 255, 255, 0.76);
        color: var(--ink);
        box-shadow: 0 8px 18px rgba(39, 71, 93, 0.12);
        cursor: pointer;
      }

      main {
        width: min(1120px, calc(100% - 32px));
        margin: 0 auto;
        display: grid;
        grid-template-columns: minmax(0, 0.92fr) minmax(320px, 1.08fr);
        gap: clamp(24px, 5vw, 58px);
        align-items: center;
        padding: 14px 0 44px;
      }

      .intro {
        display: grid;
        gap: 22px;
      }

      h1 {
        margin: 0;
        max-width: 9ch;
        font-size: clamp(3.3rem, 10vw, 7rem);
        line-height: 0.92;
        letter-spacing: 0;
      }

      .lead {
        margin: 0;
        max-width: 32rem;
        color: var(--muted);
        font-size: clamp(1.15rem, 2.7vw, 1.55rem);
        line-height: 1.35;
        font-weight: 650;
      }

      .time-picker {
        display: grid;
        grid-template-columns: repeat(5, minmax(74px, 1fr));
        gap: 10px;
        max-width: 520px;
      }

      .mode-picker {
        display: grid;
        grid-template-columns: repeat(4, minmax(104px, 1fr));
        gap: 10px;
        max-width: 640px;
      }

      .time-choice,
      .mode-choice {
        min-height: 62px;
        border: 0;
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.78);
        color: var(--ink);
        box-shadow: 0 10px 18px rgba(39, 71, 93, 0.12);
        cursor: pointer;
        font-size: clamp(1rem, 2.8vw, 1.24rem);
        font-weight: 950;
      }

      .mode-choice {
        min-height: 92px;
        display: grid;
        place-items: center;
        gap: 4px;
        padding: 10px 8px;
      }

      .mode-icon {
        display: block;
        font-size: clamp(2rem, 5vw, 3rem);
        line-height: 1;
      }

      .mode-text {
        display: block;
        font-size: clamp(0.9rem, 2.4vw, 1.12rem);
        line-height: 1.05;
      }

      .time-choice[aria-pressed="true"],
      .mode-choice[aria-pressed="true"] {
        background: var(--lemon);
        box-shadow:
          inset 0 0 0 4px rgba(255, 255, 255, 0.85),
          0 12px 22px rgba(199, 126, 28, 0.2);
      }

      .minute-row {
        display: grid;
        grid-template-columns: repeat(var(--block-count, 3), minmax(78px, 1fr));
        gap: 12px;
        max-width: 430px;
      }

      .minute-block {
        min-height: 106px;
        border-radius: 8px;
        display: grid;
        place-items: center;
        position: relative;
        overflow: hidden;
        background: rgba(255, 255, 255, 0.75);
        border: 4px solid rgba(255, 255, 255, 0.85);
        box-shadow: 0 12px 24px rgba(33, 71, 104, 0.12);
        transition:
          transform 250ms ease,
          filter 250ms ease,
          opacity 250ms ease;
      }

      .minute-block::before {
        content: "";
        position: absolute;
        inset: auto 0 0;
        height: var(--fill, 100%);
        background: var(--tone);
        transition: height 400ms linear;
      }

      .minute-block.done {
        transform: translateY(-2px);
      }

      .minute-label {
        position: relative;
        z-index: 1;
        display: grid;
        place-items: center;
        gap: 2px;
        color: #123047;
        text-align: center;
        font-weight: 950;
      }

      .minute-label strong {
        font-size: 2.7rem;
        line-height: 1;
      }

      .minute-label span {
        font-size: 1rem;
      }

      .timer-stage {
        background: rgba(255, 255, 255, 0.72);
        border: 4px solid rgba(255, 255, 255, 0.72);
        border-radius: 8px;
        box-shadow: var(--shadow);
        padding: clamp(18px, 4vw, 34px);
        display: grid;
        gap: 22px;
      }

      .visual {
        min-height: clamp(290px, 46vw, 430px);
        border-radius: 8px;
        position: relative;
        overflow: hidden;
        background:
          linear-gradient(180deg, #a7dcff 0 54%, #85d49b 54% 100%);
      }

      .cloud {
        position: absolute;
        width: 100px;
        height: 36px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.9);
        top: 32px;
        left: 10%;
        box-shadow:
          32px -12px 0 8px rgba(255, 255, 255, 0.9),
          62px 0 0 2px rgba(255, 255, 255, 0.9);
      }

      .cloud.two {
        top: 78px;
        left: auto;
        right: 8%;
        transform: scale(0.82);
        opacity: 0.82;
      }

      .finish-scene {
        position: absolute;
        width: clamp(86px, 15vw, 138px);
        height: clamp(92px, 16vw, 142px);
        right: 5%;
        bottom: 28%;
        z-index: 3;
      }

      .bed,
      .bath,
      .daycare,
      .towel,
      .clothes {
        position: absolute;
        left: 0;
        bottom: 0;
        width: 76%;
        height: 52%;
      }

      .bed {
        display: none;
        border-radius: 8px;
        background: #8f7bd8;
        box-shadow: inset 0 -9px 0 rgba(41, 32, 92, 0.18);
      }

      .bed::before {
        content: "";
        position: absolute;
        right: 6%;
        top: 12%;
        width: 30%;
        height: 38%;
        border-radius: 8px;
        background: #fff7df;
      }

      .bed::after {
        content: "";
        position: absolute;
        left: -3%;
        right: -3%;
        bottom: -12%;
        height: 16%;
        border-radius: 999px;
        background: var(--ink);
      }

      .bath {
        display: none;
        height: 48%;
        border-radius: 12px 12px 32px 32px;
        background: #ffffff;
        box-shadow:
          inset 0 -12px 0 rgba(99, 171, 201, 0.26),
          0 8px 0 rgba(23, 50, 77, 0.12);
      }

      .bath::before {
        content: "";
        position: absolute;
        left: 10%;
        right: 10%;
        top: 18%;
        height: 28%;
        border-radius: 999px;
        background: #8edcff;
      }

      .bath::after {
        content: "";
        position: absolute;
        right: 10%;
        top: -36%;
        width: 16%;
        height: 46%;
        border: 8px solid var(--ink);
        border-left: 0;
        border-bottom: 0;
        border-radius: 0 24px 0 0;
      }

      .daycare {
        display: none;
        height: 60%;
        border-radius: 8px;
        background: #ffe08a;
        box-shadow: inset 0 -9px 0 rgba(168, 101, 38, 0.18);
      }

      .daycare::before {
        content: "";
        position: absolute;
        left: 10%;
        right: 10%;
        top: -42%;
        height: 58%;
        background: #ef6f6c;
        clip-path: polygon(50% 0, 100% 100%, 0 100%);
      }

      .daycare::after {
        content: "";
        position: absolute;
        left: 38%;
        bottom: 0;
        width: 24%;
        height: 38%;
        border-radius: 8px 8px 0 0;
        background: var(--ink);
        box-shadow:
          -28px -12px 0 -8px #ffffff,
          28px -12px 0 -8px #ffffff;
      }

      .towel {
        display: none;
        height: 66%;
      }

      .towel::before {
        content: "";
        position: absolute;
        left: 12%;
        top: 0;
        width: 50%;
        height: 74%;
        border-radius: 14px;
        background:
          repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.35) 0 10px, transparent 10px 20px),
          #7ed6c4;
        box-shadow: inset 0 -10px 0 rgba(35, 110, 103, 0.18);
      }

      .towel::after {
        content: "";
        position: absolute;
        right: 8%;
        bottom: 0;
        width: 52%;
        height: 22%;
        border-radius: 999px;
        background: #fff7df;
        box-shadow: inset 0 -8px 0 rgba(35, 110, 103, 0.12);
      }

      .clothes {
        display: none;
        height: 64%;
      }

      .clothes::before {
        content: "";
        position: absolute;
        left: 18%;
        top: 4%;
        width: 52%;
        height: 66%;
        border-radius: 16px 16px 10px 10px;
        background: #f28c54;
        clip-path: polygon(18% 0, 38% 12%, 50% 0, 62% 12%, 82% 0, 100% 32%, 82% 44%, 82% 100%, 18% 100%, 18% 44%, 0 32%);
        box-shadow: inset 0 -10px 0 rgba(122, 65, 25, 0.14);
      }

      .clothes::after {
        content: "";
        position: absolute;
        right: 6%;
        bottom: 2%;
        width: 34%;
        height: 42%;
        border-radius: 10px 10px 18px 18px;
        background:
          linear-gradient(90deg, transparent 44%, rgba(255, 255, 255, 0.85) 44% 56%, transparent 56%),
          #3f70d8;
        box-shadow: inset 0 -8px 0 rgba(33, 54, 117, 0.16);
      }

      .mode-sleep .bed,
      .mode-bath .bath,
      .mode-daycare .daycare,
      .mode-out-bath .towel,
      .mode-dress .clothes {
        display: block;
      }

      .finish-flag {
        position: absolute;
        right: 0;
        top: 0;
        width: 44%;
        height: 60%;
      }

      .finish-flag::before {
        content: "";
        position: absolute;
        right: 0;
        top: 0;
        width: 8px;
        height: 100%;
        border-radius: 999px;
        background: var(--ink);
      }

      .finish-flag::after {
        content: "";
        position: absolute;
        right: 8px;
        top: 6px;
        width: 44px;
        height: 30px;
        border-radius: 6px 0 0 6px;
        background:
          linear-gradient(45deg, #ffffff 25%, transparent 25% 50%, #ffffff 50% 75%, transparent 75%),
          var(--ink);
        background-size: 18px 18px;
      }

      .road-map {
        position: absolute;
        inset: 42% 5% 16%;
        width: 90%;
        height: 30%;
        overflow: visible;
        z-index: 1;
      }

      .road-shadow,
      .road-base,
      .road-progress,
      .road-dashes {
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .road-shadow {
        stroke: rgba(28, 65, 82, 0.18);
        stroke-width: 52;
        transform: translateY(10px);
      }

      .road-base {
        stroke: #f6efe4;
        stroke-width: 44;
      }

      .road-progress {
        stroke: var(--lemon);
        stroke-width: 30;
        stroke-dasharray: 100;
        stroke-dashoffset: var(--road-left, 100);
        transition: stroke-dashoffset 500ms linear;
      }

      .road-dashes {
        stroke: rgba(23, 50, 77, 0.38);
        stroke-width: 6;
        stroke-dasharray: 2 14;
      }

      .road-stations {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 2;
      }

      .station {
        position: absolute;
        width: clamp(34px, 7vw, 52px);
        height: clamp(34px, 7vw, 52px);
        left: var(--x);
        bottom: var(--y);
        transform: translate(-50%, 50%);
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: #ffffff;
        border: 5px solid var(--tone);
        color: var(--ink);
        font-weight: 950;
        box-shadow: 0 10px 18px rgba(26, 66, 86, 0.18);
      }

      .station.done {
        background: var(--tone);
      }

      .runner {
        position: absolute;
        left: var(--runner-left, 8%);
        bottom: 20%;
        width: clamp(58px, 10vw, 86px);
        height: clamp(92px, 16vw, 132px);
        transform: translateX(-50%);
        transition: left 500ms linear;
        filter: drop-shadow(0 13px 12px rgba(19, 54, 77, 0.24));
        z-index: 4;
      }

      .kid-head {
        position: absolute;
        width: 38%;
        aspect-ratio: 1;
        border-radius: 50%;
        left: 31%;
        top: 2%;
        background: #ffd39c;
        box-shadow: inset -5px -4px 0 rgba(151, 86, 42, 0.14);
      }

      .kid-head::before,
      .kid-head::after {
        content: "";
        position: absolute;
        top: 38%;
        width: 10%;
        height: 10%;
        border-radius: 50%;
        background: var(--ink);
      }

      .kid-head::before {
        right: 32%;
      }

      .kid-head::after {
        left: 32%;
      }

      .kid-body {
        position: absolute;
        width: 46%;
        height: 36%;
        left: 27%;
        top: 36%;
        border-radius: 18px 18px 12px 12px;
        background: var(--berry);
        box-shadow: inset 0 -8px 0 rgba(117, 32, 62, 0.16);
      }

      .mode-bath .kid-body {
        background: #28a7d8;
      }

      .mode-daycare .kid-body {
        background: #4e9c64;
      }

      .mode-out-bath .kid-body {
        background: #7ed6c4;
      }

      .mode-dress .kid-body {
        background: #f28c54;
      }

      .kid-arm,
      .kid-leg {
        position: absolute;
        width: 10%;
        border-radius: 999px;
        background: var(--ink);
        transform-origin: top center;
      }

      .kid-arm {
        height: 30%;
        top: 42%;
      }

      .kid-arm.one {
        right: 20%;
        transform: rotate(28deg);
      }

      .kid-arm.two {
        left: 20%;
        transform: rotate(-28deg);
      }

      .kid-leg {
        height: 31%;
        top: 68%;
      }

      .kid-leg.one {
        right: 34%;
        transform: rotate(17deg);
      }

      .kid-leg.two {
        left: 34%;
        transform: rotate(-17deg);
      }

      .kid-label {
        position: absolute;
        top: -14%;
        left: 50%;
        transform: translateX(-50%);
        min-width: max-content;
        padding: 5px 9px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.9);
        color: var(--ink);
        font-size: clamp(0.72rem, 1.7vw, 0.95rem);
        font-weight: 900;
        box-shadow: 0 8px 14px rgba(25, 65, 87, 0.14);
      }

      .readout {
        display: grid;
        grid-template-columns: auto 1fr;
        align-items: center;
        gap: 18px;
      }

      .time {
        min-width: 178px;
        border-radius: 8px;
        background: var(--ink);
        color: white;
        text-align: center;
        padding: 12px 18px 16px;
        font-size: clamp(2.5rem, 8vw, 5rem);
        line-height: 1;
        font-weight: 950;
        font-variant-numeric: tabular-nums;
      }

      .status {
        margin: 0;
        font-size: clamp(1.3rem, 3.5vw, 2.35rem);
        line-height: 1.12;
        font-weight: 950;
      }

      .countdown-dots {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 8px;
        max-width: 220px;
        margin-top: 12px;
        opacity: 0;
        transform: translateY(4px);
        transition:
          opacity 220ms ease,
          transform 220ms ease;
      }

      .countdown-dots.show {
        opacity: 1;
        transform: translateY(0);
      }

      .countdown-dot {
        aspect-ratio: 1;
        border-radius: 50%;
        background: var(--lemon);
        border: 4px solid rgba(255, 255, 255, 0.9);
        box-shadow: 0 8px 14px rgba(90, 80, 40, 0.14);
        transition:
          opacity 180ms ease,
          transform 180ms ease,
          background 180ms ease;
      }

      .countdown-dot.off {
        opacity: 0.28;
        transform: scale(0.72);
        background: rgba(255, 255, 255, 0.8);
      }

      .controls {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }

      .control {
        min-height: 64px;
        border: 0;
        border-radius: 8px;
        color: #112f47;
        background: #ffffff;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        font-size: clamp(1.1rem, 3vw, 1.35rem);
        font-weight: 900;
        box-shadow: 0 10px 20px rgba(39, 71, 93, 0.14);
      }

      .control.primary {
        background: var(--mint);
      }

      .control:active,
      .sound-toggle:active {
        transform: translateY(2px);
      }

      .icon {
        width: 1.35em;
        height: 1.35em;
        display: inline-block;
      }

      .finished .visual {
        animation: celebrate 900ms ease-in-out infinite alternate;
      }

      .finished .runner {
        animation: bounce 520ms ease-in-out infinite alternate;
      }

      @keyframes bounce {
        from {
          transform: translateX(-50%) translateY(0);
        }
        to {
          transform: translateX(-50%) translateY(-14px);
        }
      }

      @keyframes celebrate {
        from {
          filter: saturate(1);
        }
        to {
          filter: saturate(1.25) brightness(1.03);
        }
      }

      @media (max-width: 790px) {
        header {
          padding-top: 12px;
        }

        main {
          grid-template-columns: 1fr;
          align-items: start;
          padding-top: 8px;
        }

        .intro {
          gap: 16px;
        }

        h1 {
          max-width: 11ch;
        }

        .lead {
          font-size: 1.12rem;
        }

        .time-picker {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .mode-picker {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .timer-stage {
          padding: 14px;
        }

        .readout {
          grid-template-columns: 1fr;
          gap: 12px;
        }

        .time {
          min-width: 0;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.001ms !important;
          animation-iteration-count: 1 !important;
          scroll-behavior: auto !important;
          transition-duration: 0.001ms !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="page mode-sleep" id="app">
      <header>
        <div class="brand" aria-label="טיימר של שלוש דקות">
          <div class="brand-mark" aria-hidden="true">
            <svg class="icon" viewBox="0 0 24 24" fill="none">
              <circle cx="12" cy="12" r="8" stroke="currentColor" stroke-width="2.5" />
              <path d="M12 7v5l3 2" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" />
            </svg>
          </div>
          <span>טיימר קטן</span>
        </div>
        <button class="sound-toggle" id="soundToggle" type="button">צליל בסוף: פעיל</button>
      </header>

      <main>
        <section class="intro" aria-labelledby="title">
          <h1 id="title">3 דקות</h1>
          <p class="lead" id="lead">כל קובייה היא דקה אחת. כשהכול מתמלא, הזמן נגמר ואפשר לעבור לדבר הבא.</p>

          <div class="time-picker" aria-label="בחירת זמן לטיימר">
            <button class="time-choice" type="button" data-seconds="10" aria-pressed="false">10 שניות</button>
            <button class="time-choice" type="button" data-seconds="30" aria-pressed="false">חצי דקה</button>
            <button class="time-choice" type="button" data-seconds="60" aria-pressed="false">דקה</button>
            <button class="time-choice" type="button" data-seconds="120" aria-pressed="false">2 דקות</button>
            <button class="time-choice" type="button" data-seconds="180" aria-pressed="true">3 דקות</button>
          </div>

          <div class="mode-picker" aria-label="בחירת מצב לטיימר">
            <button class="mode-choice" type="button" data-mode="sleep" aria-pressed="true" aria-label="מצב שינה">
              <span class="mode-icon" aria-hidden="true">☾</span>
              <span class="mode-text">שינה</span>
            </button>
            <button class="mode-choice" type="button" data-mode="bath" aria-pressed="false" aria-label="מצב אמבטיה">
              <span class="mode-icon" aria-hidden="true">♨</span>
              <span class="mode-text">אמבטיה</span>
            </button>
            <button class="mode-choice" type="button" data-mode="daycare" aria-pressed="false" aria-label="הולכים לגן">
              <span class="mode-icon" aria-hidden="true">⌂</span>
              <span class="mode-text">גן</span>
            </button>
            <button class="mode-choice" type="button" data-mode="outBath" aria-pressed="false" aria-label="יוצאים מהאמבטיה">
              <span class="mode-icon" aria-hidden="true">▤</span>
              <span class="mode-text">מגבת</span>
            </button>
            <button class="mode-choice" type="button" data-mode="dress" aria-pressed="false" aria-label="להתלבש">
              <span class="mode-icon" aria-hidden="true">◧</span>
              <span class="mode-text">להתלבש</span>
            </button>
          </div>

          <div class="minute-row" aria-label="שלוש דקות מחולקות לשלושה חלקים">
          </div>
        </section>

        <section class="timer-stage" aria-label="טיימר פעיל">
          <div class="visual" id="visual">
            <div class="cloud"></div>
            <div class="cloud two"></div>
            <div class="finish-scene" aria-hidden="true">
              <div class="finish-flag"></div>
              <div class="bed"></div>
              <div class="bath"></div>
              <div class="daycare"></div>
              <div class="towel"></div>
              <div class="clothes"></div>
            </div>
            <svg class="road-map" viewBox="0 0 900 420" aria-hidden="true" preserveAspectRatio="none">
              <path class="road-shadow" d="M80 250 L790 250" />
              <path class="road-base" d="M80 250 L790 250" />
              <path class="road-progress" pathLength="100" d="M80 250 L790 250" />
              <path class="road-dashes" d="M80 250 L790 250" />
            </svg>
            <div class="road-stations" aria-hidden="true">
            </div>
            <div class="runner" aria-hidden="true">
              <div class="kid-label" id="kidLabel">למיטה</div>
              <div class="kid-head"></div>
              <div class="kid-body"></div>
              <div class="kid-arm one"></div>
              <div class="kid-arm two"></div>
              <div class="kid-leg one"></div>
              <div class="kid-leg two"></div>
            </div>
          </div>

          <div class="readout">
            <div class="time" id="time" aria-live="polite">3:00</div>
            <div>
              <p class="status" id="status">מוכנים להתחיל?</p>
              <div class="countdown-dots" id="countdownDots" aria-hidden="true">
                <span class="countdown-dot"></span>
                <span class="countdown-dot"></span>
                <span class="countdown-dot"></span>
                <span class="countdown-dot"></span>
                <span class="countdown-dot"></span>
              </div>
            </div>
          </div>

          <div class="controls">
            <button class="control primary" id="startPause" type="button">
              <svg class="icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path d="M8 5.2v13.6c0 .8.9 1.3 1.6.8l9.6-6.8c.6-.4.6-1.3 0-1.7L9.6 4.4C8.9 3.9 8 4.4 8 5.2Z" />
              </svg>
              <span>התחלה</span>
            </button>
            <button class="control" id="reset" type="button">
              <svg class="icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M5 8a8 8 0 1 1 1 9" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" />
                <path d="M5 4v4h4" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
              <span>מהתחלה</span>
            </button>
          </div>
        </section>
      </main>
    </div>

    <script>
      const options = {
        10: { title: "10 שניות", lead: "מסלול קצרצר. מגיעים לדגל ממש מהר.", blocks: ["10"], aria: "עשר שניות" },
        30: { title: "חצי דקה", lead: "קובייה אחת קצרה. כשהיא מתמלאת, הזמן נגמר.", blocks: ["חצי"], aria: "חצי דקה" },
        60: { title: "דקה", lead: "קובייה אחת היא דקה אחת. כשהיא מתמלאת, הזמן נגמר.", blocks: ["1"], aria: "דקה אחת" },
        120: { title: "2 דקות", lead: "כל קובייה היא דקה אחת. כשהשתיים מתמלאות, הזמן נגמר.", blocks: ["1", "2"], aria: "שתי דקות מחולקות לשני חלקים" },
        180: { title: "3 דקות", lead: "כל קובייה היא דקה אחת. כשהכול מתמלא, הזמן נגמר ואפשר לעבור לדבר הבא.", blocks: ["1", "2", "3"], aria: "שלוש דקות מחולקות לשלושה חלקים" },
      };

      const modes = {
        sleep: {
          label: "למיטה",
          lead: "עכשיו הולכים לאט לאט למיטה.",
          ready: "מוכנים ללכת למיטה?",
          done: "הגענו למיטה. לילה טוב.",
          almost: "כמעט במיטה.",
          sound: [
            { frequency: 392, start: 0, duration: 0.34, volume: 0.1, type: "sine" },
            { frequency: 330, start: 0.24, duration: 0.42, volume: 0.08, type: "sine" },
            { frequency: 262, start: 0.52, duration: 0.5, volume: 0.07, type: "sine" },
          ],
        },
        bath: {
          label: "לאמבטיה",
          lead: "עכשיו הולכים לאט לאט לאמבטיה.",
          ready: "מוכנים ללכת לאמבטיה?",
          done: "הגענו לאמבטיה. כל הכבוד.",
          almost: "כמעט באמבטיה.",
          className: "mode-bath",
          sound: [
            { frequency: 660, start: 0, duration: 0.16, volume: 0.12, type: "triangle" },
            { frequency: 880, start: 0.14, duration: 0.16, volume: 0.1, type: "triangle" },
            { frequency: 740, start: 0.3, duration: 0.18, volume: 0.11, type: "triangle" },
            { frequency: 990, start: 0.48, duration: 0.2, volume: 0.09, type: "triangle" },
          ],
        },
        daycare: {
          label: "לגן",
          lead: "עכשיו הולכים לאט לאט לגן.",
          ready: "מוכנים ללכת לגן?",
          done: "הגענו לגן. יום נעים.",
          almost: "כמעט בגן.",
          className: "mode-daycare",
          sound: [
            { frequency: 523.25, start: 0, duration: 0.18, volume: 0.13, type: "sine" },
            { frequency: 659.25, start: 0.16, duration: 0.18, volume: 0.13, type: "sine" },
            { frequency: 783.99, start: 0.32, duration: 0.24, volume: 0.12, type: "sine" },
          ],
        },
        outBath: {
          label: "למגבת",
          lead: "עכשיו יוצאים מהאמבטיה ומתנגבים.",
          ready: "מוכנים לצאת מהאמבטיה?",
          done: "יצאנו מהאמבטיה. כל הכבוד.",
          almost: "כמעט סיימנו באמבטיה.",
          className: "mode-out-bath",
          sound: [
            { frequency: 587.33, start: 0, duration: 0.2, volume: 0.1, type: "sine" },
            { frequency: 698.46, start: 0.18, duration: 0.24, volume: 0.1, type: "sine" },
          ],
        },
        dress: {
          label: "לבגדים",
          lead: "עכשיו הולכים להתלבש.",
          ready: "מוכנים להתלבש?",
          done: "התלבשנו. כל הכבוד.",
          almost: "כמעט לבושים.",
          className: "mode-dress",
          sound: [
            { frequency: 440, start: 0, duration: 0.18, volume: 0.11, type: "sine" },
            { frequency: 554.37, start: 0.16, duration: 0.18, volume: 0.11, type: "sine" },
            { frequency: 659.25, start: 0.32, duration: 0.22, volume: 0.1, type: "sine" },
          ],
        },
      };

      modes.sleep.className = "mode-sleep";

      const app = document.querySelector("#app");
      const visual = document.querySelector("#visual");
      const titleEl = document.querySelector("#title");
      const leadEl = document.querySelector("#lead");
      const timeEl = document.querySelector("#time");
      const statusEl = document.querySelector("#status");
      const startPause = document.querySelector("#startPause");
      const reset = document.querySelector("#reset");
      const soundToggle = document.querySelector("#soundToggle");
      const timeChoices = [...document.querySelectorAll(".time-choice")];
      const modeChoices = [...document.querySelectorAll(".mode-choice")];
      const blockRow = document.querySelector(".minute-row");
      const roadStations = document.querySelector(".road-stations");
      const kidLabel = document.querySelector("#kidLabel");
      const countdownDots = document.querySelector("#countdownDots");
      const countdownDotEls = [...document.querySelectorAll(".countdown-dot")];

      let totalSeconds = 180;
      let remaining = totalSeconds;
      let currentMode = "sleep";
      let running = false;
      let timerId = null;
      let soundOn = true;
      let audioCtx = null;
      let audioUnlocked = false;

      const startIcon = `
        <svg class="icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M8 5.2v13.6c0 .8.9 1.3 1.6.8l9.6-6.8c.6-.4.6-1.3 0-1.7L9.6 4.4C8.9 3.9 8 4.4 8 5.2Z" />
        </svg><span>התחלה</span>`;
      const pauseIcon = `
        <svg class="icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M7 5h3.5v14H7V5Zm6.5 0H17v14h-3.5V5Z" />
        </svg><span>עצירה</span>`;

      function formatTime(seconds) {
        const mins = Math.floor(seconds / 60);
        const secs = seconds % 60;
        return `${mins}:${String(secs).padStart(2, "0")}`;
      }

      function blockWord(count) {
        if (count === 1) return "חלק אחד";
        if (count === 2) return "שני חלקים";
        return "שלושה חלקים";
      }

      function roadPoint(progress) {
        return {
          x: 8 + progress * 78,
          y: 24,
        };
      }

      function renderBlocks() {
        const option = options[totalSeconds];
        blockRow.style.setProperty("--block-count", option.blocks.length);
        blockRow.setAttribute("aria-label", option.aria);
        blockRow.innerHTML = option.blocks
          .map((label, index) => {
            const tone = ["var(--mint)", "var(--peach)", "var(--lemon)"][index] || "var(--mint)";
            const text = label === "10" ? "שניות" : label === "חצי" ? "דקה" : Number(label) === 1 ? "דקה" : "דקות";
            return `
              <div class="minute-block" style="--tone: ${tone}; --fill: 0%" data-minute="${index}">
                <div class="minute-label">
                  <strong>${label}</strong>
                  <span>${text}</span>
                </div>
              </div>`;
          })
          .join("");
      }

      function renderStations() {
        const option = options[totalSeconds];
        roadStations.innerHTML = option.blocks
          .map((label, index) => {
            const tone = ["var(--mint)", "var(--peach)", "var(--lemon)"][index] || "var(--mint)";
            const point = roadPoint((index + 1) / option.blocks.length);
            return `<div class="station" style="--x: ${point.x}%; --y: ${point.y}%; --tone: ${tone}" data-station="${index}">${label}</div>`;
          })
          .join("");
      }

      function refreshCopy() {
        const option = options[totalSeconds];
        const mode = modes[currentMode];
        titleEl.textContent = option.title;
        leadEl.textContent = `${option.lead} ${mode.lead}`;
        kidLabel.textContent = mode.label;
      }

      function setDuration(seconds) {
        stopTimer();
        totalSeconds = seconds;
        remaining = totalSeconds;

        timeChoices.forEach((choice) => {
          choice.setAttribute("aria-pressed", String(Number(choice.dataset.seconds) === seconds));
        });
        refreshCopy();
        renderBlocks();
        renderStations();
        update();
      }

      function setMode(modeName) {
        stopTimer();
        currentMode = modeName;
        remaining = totalSeconds;
        Object.values(modes).forEach((mode) => {
          app.classList.remove(mode.className);
        });
        app.classList.add(modes[currentMode].className);
        modeChoices.forEach((choice) => {
          choice.setAttribute("aria-pressed", String(choice.dataset.mode === modeName));
        });
        refreshCopy();
        update();
      }

      function getAudioContext() {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return null;
        if (!audioCtx) audioCtx = new AudioContext();
        return audioCtx;
      }

      async function unlockSound() {
        if (!soundOn || audioUnlocked) return;
        const ctx = getAudioContext();
        if (!ctx) return;
        if (ctx.state === "suspended") {
          await ctx.resume();
        }

        const oscillator = ctx.createOscillator();
        const gain = ctx.createGain();
        gain.gain.setValueAtTime(0.0001, ctx.currentTime);
        oscillator.connect(gain).connect(ctx.destination);
        oscillator.start(ctx.currentTime);
        oscillator.stop(ctx.currentTime + 0.03);
        audioUnlocked = true;
      }

      async function playDoneSound() {
        if (!soundOn) return;
        const ctx = getAudioContext();
        if (!ctx) return;
        if (ctx.state === "suspended") {
          await ctx.resume();
        }

        if ("vibrate" in navigator) {
          navigator.vibrate([180, 80, 180]);
        }

        modes[currentMode].sound.forEach((note) => {
          const oscillator = ctx.createOscillator();
          const gain = ctx.createGain();
          const start = ctx.currentTime + note.start;
          oscillator.frequency.value = note.frequency;
          oscillator.type = note.type;
          gain.gain.setValueAtTime(0.0001, start);
          gain.gain.linearRampToValueAtTime(note.volume, start + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.001, start + note.duration);
          oscillator.connect(gain).connect(ctx.destination);
          oscillator.start(start);
          oscillator.stop(start + note.duration + 0.02);
        });
      }

      function update() {
        const progress = remaining / totalSeconds;
        const elapsed = 1 - progress;
        const carPoint = roadPoint(elapsed);
        visual.style.setProperty("--road-left", `${100 - elapsed * 100}`);
        visual.style.setProperty("--runner-left", `${carPoint.x}%`);
        timeEl.textContent = formatTime(remaining);

        const blocks = [...document.querySelectorAll(".minute-block")];
        const elapsedSeconds = totalSeconds - remaining;
        const blockSeconds = totalSeconds / blocks.length;
        blocks.forEach((block, index) => {
          const blockStart = index * blockSeconds;
          const fill = Math.min(100, Math.max(0, ((elapsedSeconds - blockStart) / blockSeconds) * 100));
          block.style.setProperty("--fill", `${fill}%`);
          block.classList.toggle("done", fill === 100);
        });

        const stations = [...document.querySelectorAll(".station")];
        stations.forEach((station, index) => {
          station.classList.toggle("done", elapsed >= (index + 1) / stations.length);
        });

        const showFinalDots = remaining > 0 && remaining <= 5;
        countdownDots.classList.toggle("show", showFinalDots);
        countdownDotEls.forEach((dot, index) => {
          dot.classList.toggle("off", !showFinalDots || index >= remaining);
        });

        if (remaining === totalSeconds) {
          statusEl.textContent = modes[currentMode].ready;
        } else if (remaining === 0) {
          statusEl.textContent = modes[currentMode].done;
        } else if (remaining <= 10) {
          statusEl.textContent = modes[currentMode].almost;
        } else {
          const totalBlocks = options[totalSeconds].blocks.length;
          const blocksLeft = Math.max(1, Math.ceil((remaining / totalSeconds) * totalBlocks));
          statusEl.textContent = blocksLeft === 1 ? "נשאר חלק אחד." : `נשארו ${blockWord(blocksLeft)}.`;
        }

        app.classList.toggle("finished", remaining === 0);
      }

      function stopTimer() {
        running = false;
        window.clearInterval(timerId);
        timerId = null;
        startPause.innerHTML = startIcon;
      }

      function startTimer() {
        unlockSound();
        if (remaining === 0) remaining = totalSeconds;
        running = true;
        startPause.innerHTML = pauseIcon;
        update();
        timerId = window.setInterval(() => {
          remaining = Math.max(0, remaining - 1);
          update();
          if (remaining === 0) {
            stopTimer();
            playDoneSound();
          }
        }, 1000);
      }

      startPause.addEventListener("click", () => {
        if (running) {
          stopTimer();
          statusEl.textContent = "עצרנו רגע.";
          return;
        }
        startTimer();
      });

      reset.addEventListener("click", () => {
        stopTimer();
        remaining = totalSeconds;
        update();
      });

      timeChoices.forEach((choice) => {
        choice.addEventListener("click", () => {
          setDuration(Number(choice.dataset.seconds));
        });
      });

      modeChoices.forEach((choice) => {
        choice.addEventListener("click", () => {
          setMode(choice.dataset.mode);
        });
      });

      soundToggle.addEventListener("click", () => {
        soundOn = !soundOn;
        soundToggle.textContent = soundOn ? "צליל בסוף: פעיל" : "צליל בסוף: כבוי";
        if (soundOn) unlockSound();
      });

      document.addEventListener("pointerdown", unlockSound, { once: true });

      refreshCopy();
      renderStations();
      renderBlocks();
      update();
    </script>
  </body>
</html>
